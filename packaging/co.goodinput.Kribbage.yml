# Flatpak manifest for Flathub. Build: flatpak-builder --user --install build packaging/co.goodinput.Kribbage.yml
id: co.goodinput.Kribbage
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: kribbage
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: kribbage
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: ..
