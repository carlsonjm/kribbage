<title>Kribbage Trail Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a full-window scene (the trail, seen from a pitched camera) with quiet glass panels laid over it. */
:root {
  --piano: #141414;
  --ghost: #F8F8FF;
  --ghost-soft: rgba(248,248,255,0.66);
  --glass: rgba(20,20,20,0.72);
  --raised: #242424;
  --line: rgba(248,248,255,0.14);
  --you: #C8241C;
  --them: #1F5BC8;
  --ui: 'Noto Sans', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--piano); color: var(--ghost); font-family: var(--ui); overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header h1 { margin: 0; font-size: 16px; font-weight: 600; }
#menu-btn { display: inline-flex; align-items: center; gap: 8px; }
.menu { right: 12px; top: 12px; z-index: 5; width: min(380px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; padding: 8px 16px 16px; box-sizing: border-box; background: rgba(20,20,20,0.92); }
.menu section + section { border-top: 1px solid var(--line); }
.menu h2 { margin: 14px 0 8px; font-size: 12px; font-weight: 600; color: var(--ghost-soft); text-transform: uppercase; letter-spacing: 0.06em; }
.menu .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.menu .seg button { height: 36px; padding: 0 12px; font-size: 13px; }
.menu .wide { width: 100%; margin: 4px 0 6px; }
.menu .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 2px; font-size: 14px; }
.menu .switch small { display: block; font-size: 12px; color: var(--ghost-soft); margin-top: 2px; }
.menu .switch button { flex-shrink: 0; width: 46px; height: 28px; padding: 0; border-radius: 14px; position: relative; background: #3a3a3a; }
.menu .switch button i { position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ghost); transition: transform 160ms ease-out; }
.menu .switch button[aria-checked="true"] { background: #C49BFF; }
.menu .switch button[aria-checked="true"] i { transform: translateX(18px); }
header .sub { font-size: 13px; color: var(--ghost-soft); flex: 1 1 200px; min-width: 0; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
button {
  font: inherit; font-size: 14px; color: var(--ghost); background: var(--raised);
  border: none; height: 40px; padding: 0 16px; border-radius: 20px; cursor: pointer;
  transition: background 140ms ease-out;
}
button:hover { background: #333; }
button:focus-visible { outline: 2px solid var(--ghost); outline-offset: 2px; }
button[aria-pressed="true"] { background: rgba(248,248,255,0.24); }
button.primary { background: var(--ghost); color: var(--piano); font-weight: 600; }
button.primary:hover { background: #e4e4ee; }
button:disabled { opacity: 0.45; cursor: default; }

.stage {
  position: relative; flex: 1 1 auto; overflow: hidden; 
  border-radius: 10px; margin-left: max(16px, env(safe-area-inset-left, 0px)); margin-right: max(16px, env(safe-area-inset-right, 0px));
  background: #0d120e;
}
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform-style: preserve-3d; will-change: transform; }
.world canvas { position: absolute; left: 0; top: 0; }
.bb { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; background-repeat: no-repeat; background-size: 100% 100%; pointer-events: none; }
.peg { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; pointer-events: none; }
.peg .pin { width: 100%; height: 100%; }
.peg.hop .pin { animation: hop 90ms ease-out; }
@keyframes hop { 0% { transform: translateY(0); } 45% { transform: translateY(-9px); } 100% { transform: translateY(0); } }
.gain { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; font: 600 30px var(--ui); white-space: nowrap; pointer-events: none;
  padding: 4px 10px; border-radius: 10px; background: var(--glass); transition: opacity 600ms ease-out; }

.panel { position: absolute; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; }
.scores { left: 12px; top: 12px; padding: 12px; display: grid; grid-template-columns: auto auto auto; gap: 6px 12px; align-items: center; font-size: 14px; }
.scores .dot { width: 10px; height: 10px; border-radius: 50%; }
.scores .num { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; min-width: 44px; }
.scores .row-name { color: var(--ghost-soft); }
.event { left: 50%; top: 12px; transform: translateX(-50%); padding: 8px 14px; font-size: 14px; white-space: nowrap; transition: opacity 200ms ease-out; }
.map { right: 12px; bottom: 12px; padding: 8px; }
.map svg { display: block; width: 120px; height: auto; cursor: pointer; }
.map .mp { cursor: pointer; }
.map .mp:focus-visible { outline: none; }
.map .mp:focus-visible .ring { stroke: #F8F8FF; stroke-width: 24; }

footer {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
footer .hint { font-size: 12px; color: var(--ghost-soft); flex: 1 1 240px; min-width: 0; }
@media (max-width: 560px) { .map svg { width: 84px; } .scores .num { font-size: 18px; } }
@media (prefers-reduced-motion: reduce) { .peg, .peg .pin { transition: none; animation: none; } }

/* Pegs, cards and the table laid over the scene. */
.peg { width: 46px; height: 86px; transition: transform 90ms ease-out; }
[hidden] { display: none !important; }
.hand .card, .receipt .line { padding: 0; border: none; font: inherit; }
.hand .card { background: #F8F8FF; color: #141414; }
.hand .card.red { color: #C2402F; }
.hand .card:hover { background: #ffffff; }
.hand .card:disabled { cursor: default; }
.receipt .line { padding: 0 8px; }
.glow { position: absolute; left: 0; top: 0; width: 120px; height: 120px; border-radius: 50%; pointer-events: none; transition: transform 90ms ease-out, opacity 300ms ease-out; mix-blend-mode: screen; }
.winter .glow { mix-blend-mode: normal; }
.stage { --cw: clamp(54px, 7vw, 100px); --pw: clamp(40px, 4.6vw, 64px); }
.card { position: relative; flex-shrink: 0; box-sizing: border-box; width: var(--cw); height: calc(var(--cw) * 1.41); border-radius: 10px; background: #F8F8FF; color: #141414; box-shadow: 0 6px 18px rgba(0,0,0,0.45); font-family: var(--ui); transition: transform 220ms cubic-bezier(.33,1,.68,1), opacity 160ms ease-out, box-shadow 160ms ease-out; }
.card.red { color: #C2402F; }
.card .idx { position: absolute; left: 9%; top: 6%; display: flex; flex-direction: column; align-items: center; font-weight: 600; line-height: 1; font-size: calc(var(--w) * 0.24); gap: 2px; }
.card .idx svg { width: calc(var(--w) * 0.15); height: calc(var(--w) * 0.15); }
.card .pip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.card .pip svg { width: 46%; height: 46%; }
.card.back { background: #242424; border: 1px solid #333; box-shadow: inset 0 0 0 4px #242424, inset 0 0 0 5px rgba(248,248,255,0.14), 0 6px 18px rgba(0,0,0,0.45); }
.card.back .pearls { position: absolute; inset: 0; display: flex; gap: 8%; align-items: center; justify-content: center; }
.card.back .pearls i { width: 9%; aspect-ratio: 1; border-radius: 50%; background: rgba(248,248,255,0.72); }
.card.sm { --cw: var(--pw); }
.card.dim { opacity: 0.38; }
.card.hl { box-shadow: 0 0 0 3px #F8F8FF, 0 6px 18px rgba(0,0,0,0.45); transform: translateY(-10px); }

.hand { position: absolute; left: 50%; bottom: 10px; width: 0; height: calc(var(--cw) * 1.41 + 30px); }
.hand .card { position: absolute; left: calc(var(--cw) / -2); bottom: 0; transform-origin: 50% 120%; cursor: pointer; --w: var(--cw); }
.hand .card:focus-visible { outline: 2px solid #F8F8FF; outline-offset: 3px; }
.them-hand { position: absolute; right: 12px; top: 12px; display: flex; gap: 4px; }
.them-hand .card { --cw: 34px; --w: 34px; box-shadow: 0 3px 8px rgba(0,0,0,0.4); }

.table { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--cw) * 1.41 + 48px); display: flex; align-items: center; gap: 16px; padding: 12px 16px; max-width: calc(100% - 32px); box-sizing: border-box; }
.table .slot { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--ghost-soft); white-space: nowrap; }
.table .card { --w: var(--pw); }
.table .stack { display: flex; }
.table .stack .card + .card { margin-left: calc(var(--pw) * -0.8); }
.table .sep { width: 1px; align-self: stretch; background: var(--line); }
.pile { display: flex; align-items: center; min-width: calc(var(--pw) * 2); height: calc(var(--pw) * 1.41 + 28px); }
.pile .card { margin-left: calc(var(--pw) * -0.42); }
.pile .card:first-child { margin-left: 0; }
.pile .card.them { transform: translateY(-12px); box-shadow: 0 0 0 2px var(--them), 0 6px 18px rgba(0,0,0,0.45); }
.pile .card.you { transform: translateY(12px); }
.pile .card.hl { transform: translateY(-14px); }
.pile .empty { font-size: 12px; color: var(--ghost-soft); }
.count { display: flex; flex-direction: column; align-items: flex-start; min-width: 64px; }
.count b { font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.count span { font-size: 11px; color: var(--ghost-soft); }

.prompt { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--cw) * 1.41 + 48px + var(--pw) * 1.41 + 76px); padding: 8px 14px; font-size: 15px; white-space: nowrap; }
.act { position: absolute; right: 160px; bottom: 24px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.act .note { font-size: 12px; color: var(--ghost); text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
.act button { height: 48px; padding: 0 24px; border-radius: 24px; font-size: 15px; }

.receipt { right: 12px; top: 12px; width: min(320px, calc(100% - 24px)); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.receipt h2 { margin: 0 0 6px; padding: 0 8px; font-size: 15px; font-weight: 600; }
.receipt .line { display: grid; grid-template-columns: 76px 1fr 32px 32px; align-items: center; gap: 6px; min-height: 40px; padding: 0 8px; border-radius: 10px; font-size: 14px; cursor: pointer; border: none; background: transparent; color: var(--ghost); text-align: left; height: auto; }
.receipt .line:hover, .receipt .line.on { background: rgba(248,248,255,0.24); }
.receipt .line .c { color: var(--ghost-soft); }
.receipt .line .r { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.receipt .line .p { text-align: right; color: var(--ghost-soft); }
.receipt .total { display: flex; justify-content: space-between; padding: 10px 8px 2px; margin-top: 4px; border-top: 1px solid var(--line); font-size: 15px; font-weight: 600; }
.receipt .total b { font-size: 22px; }
.receipt .none { padding: 8px; color: var(--ghost-soft); font-size: 14px; }
.sym-r { color: #FF8A7A; }

.banner { left: 50%; top: 38%; transform: translate(-50%, -50%); padding: 24px 28px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.banner b { font-size: 28px; font-weight: 600; }
.banner span { color: var(--ghost-soft); font-size: 14px; }
.scores { top: 12px; }
@media (max-width: 760px) {
  .act { right: 12px; bottom: calc(var(--cw) * 1.41 + 40px); }
  .prompt { white-space: normal; text-align: center; width: max-content; max-width: calc(100% - 32px); }
  .map { display: none; }
  .receipt { top: auto; bottom: 8px; }
}
.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.gain { position: absolute; left: 0; top: 0; font: 600 30px var(--ui); white-space: nowrap; pointer-events: none; padding: 4px 10px; border-radius: 10px; background: var(--glass); }
.scores .fate { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; color: var(--ghost-soft); }
.scores .fate .bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(248,248,255,0.14); overflow: hidden; min-width: 80px; }
.scores .fate .bar i { display: block; height: 100%; width: 0; background: #C49BFF; border-radius: 3px; transition: width 600ms cubic-bezier(.33,1,.68,1); }
.scores .fate.full .bar i { background: #DCC2FF; box-shadow: 0 0 10px #C49BFF; }
.scores .fate.full #fate-num { color: #DCC2FF; font-weight: 600; }
.act-row { display: flex; gap: 8px; }
.scores .match-row { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ghost-soft); }
.scores .match-row .pips { display: flex; gap: 4px; }
.scores .match-row .pips i { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
.scores .match-row .pips i.on { background: currentColor; }
#act.fate { background: #C49BFF; color: #141414; box-shadow: 0 0 22px rgba(196,155,255,0.7); }
.fated { box-shadow: 0 0 0 3px #C49BFF, 0 0 28px rgba(196,155,255,0.8), 0 6px 18px rgba(0,0,0,0.45) !important; }
.panel, .table, .prompt, .hand, .act, .them-hand { z-index: 2; }
.gain { z-index: 1; }
.fly { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; will-change: transform; }
@keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
.hand.arrive .card { animation: arrive 180ms ease-out both; }
</style>
<div class="app">
  <header>
    <h1>Kribbage</h1>
    <span class="sub" id="sub">Single game against a steady opponent</span>
    <button id="new-game" class="primary">New game</button>
    <button id="menu-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu" title="Menu">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Menu</span>
    </button>
  </header>

  <div class="stage" id="stage">
    <div class="panel scores" aria-live="polite">
      <span class="dot" style="background: var(--them)"></span><span class="row-name">Computer</span><span class="num" id="score-1">0</span>
      <span class="dot" style="background: var(--you)"></span><span class="row-name">You</span><span class="num" id="score-0">0</span>
      <div class="match-row" id="match-row"></div>
      <div class="fate" id="fate-row"><span>Fate</span><span class="bar"><i id="fate-fill"></i></span><span id="fate-num">0%</span></div>
    </div>
    <div class="panel event" id="event" style="opacity: 0">Fifteen two</div>
    <div class="panel map"><svg id="map" viewBox="400 400 1800 2000" role="group" aria-label="Map of the trail. Choose a peg to look at it."></svg></div>
    <div class="them-hand" id="them-hand" aria-label="Computer's hand"></div>
    <div class="panel prompt" id="prompt" aria-live="polite"></div>
    <div class="panel table" id="table"></div>
    <div class="hand" id="hand"></div>
    <div class="act"><span class="note" id="note"></span><span class="act-row"><button id="act2" hidden>Just cut</button><button id="act" class="primary">Lay two in the crib</button></span></div>
    <div class="panel receipt" id="receipt" hidden></div>
    <div class="panel banner" id="banner" hidden></div>
    <div class="panel menu" id="menu" role="dialog" aria-label="Menu" hidden>
      <section>
        <h2>New game</h2>
        <div class="seg" role="group" aria-label="Game length">
          <button data-len="1" aria-pressed="true">Single</button><button data-len="3" aria-pressed="false">Best of 3</button><button data-len="5" aria-pressed="false">Best of 5</button><button data-len="7" aria-pressed="false">Best of 7</button>
        </div>
        <div class="seg" role="group" aria-label="Opponent">
          <button data-level="easy" aria-pressed="false">Easy</button><button data-level="steady" aria-pressed="true">Steady</button><button data-level="sharp" aria-pressed="false">Sharp</button>
        </div>
        <button id="start" class="primary wide">Start</button>
      </section>
      <section>
        <h2>Trail</h2>
        <div class="seg" role="group" aria-label="Where the trail runs">
          <button id="env-forest" data-env="forest" aria-pressed="true">Forest</button><button id="env-autumn" data-env="autumn" aria-pressed="false">Autumn</button><button id="env-winter" data-env="winter" aria-pressed="false">Winter</button>
        </div>
        <h2>Pegs</h2>
        <div class="seg" role="group" aria-label="Pegs">
          <button id="peg-brass" data-peg="brass" aria-pressed="true">Brass</button><button id="peg-slim" data-peg="slim" aria-pressed="false">Classic</button><button id="peg-firefly" data-peg="firefly" aria-pressed="false">Fireflies</button><button id="peg-toadstool" data-peg="toadstool" aria-pressed="false">Toadstools</button><button id="peg-crystal" data-peg="crystal" aria-pressed="false">Crystals</button>
        </div>
      </section>
      <section>
        <label class="switch"><span>Fate meter<small>Fills on bad luck. Call on it at the cut for the best card.</small></span><button id="fate-toggle" role="switch" aria-checked="true"><i></i></button></label>
      </section>
    </div>
  </div>
  <div style="height: 16px; flex-shrink: 0;"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const WORLD = { w: 2600, h: 2800 };
  const PAD = 400; // ground beyond the trail, so the camera never sees an edge
  const stage = document.getElementById('stage');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Seeded random so each place grows the same trees every time.
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ---- The trail: a switchback path, four turns, a quarter of the game
  // between each. Every hairpin has the same three-point shape, and the
  // legs between them bow gently with no wobble.
  const CTRL = [
    [180, 1880], [520, 1895], [900, 1865], [1260, 1810], [1520, 1710], [1600, 1550], [1460, 1425],
    [1100, 1400], [760, 1390], [460, 1345], [290, 1250], [240, 1100], [380, 995], [640, 965],
    [960, 955], [1300, 925], [1530, 820], [1590, 650], [1450, 530], [1060, 515], [700, 500],
    [420, 455], [260, 360], [240, 210], [380, 125], [760, 110], [1150, 120]
  ];
  // Centripetal Catmull-Rom: passes through every point without overshoot
  // or little loops at the tight turns.
  function catmull(p0, p1, p2, p3, t) {
    const d = (a, b) => Math.sqrt(Math.hypot(b[0] - a[0], b[1] - a[1])) || 1e-4;
    const t1 = d(p0, p1), t2 = t1 + d(p1, p2), t3 = t2 + d(p2, p3), u = t1 + (t2 - t1) * t;
    const L = (a, b, ta, tb) => [0, 1].map((k) => ((tb - u) * a[k] + (u - ta) * b[k]) / (tb - ta));
    const A1 = L(p0, p1, 0, t1), A2 = L(p1, p2, t1, t2), A3 = L(p2, p3, t2, t3);
    return L(L(A1, A2, 0, t2), L(A2, A3, t1, t3), t1, t2);
  }
  CTRL.forEach((c) => { c[0] += PAD; c[1] += PAD; });
  const samples = [];
  for (let i = 0; i < CTRL.length - 1; i++) {
    const p0 = CTRL[Math.max(0, i - 1)], p1 = CTRL[i], p2 = CTRL[i + 1], p3 = CTRL[Math.min(CTRL.length - 1, i + 2)];
    for (let j = 0; j < 80; j++) samples.push(catmull(p0 === p1 ? [2 * p1[0] - p2[0], 2 * p1[1] - p2[1]] : p0, p1, p2, p3 === p2 ? [2 * p2[0] - p1[0], 2 * p2[1] - p1[1]] : p3, j / 80));
  }
  samples.push(CTRL[CTRL.length - 1]);
  const arc = [0];
  for (let i = 1; i < samples.length; i++) arc.push(arc[i - 1] + Math.hypot(samples[i][0] - samples[i - 1][0], samples[i][1] - samples[i - 1][1]));
  const LENGTH = arc[arc.length - 1];
  function along(s) {
    s = Math.max(0, Math.min(LENGTH, s));
    let lo = 0, hi = arc.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (arc[mid] < s) lo = mid; else hi = mid; }
    const f = (s - arc[lo]) / ((arc[hi] - arc[lo]) || 1);
    const a = samples[lo], b = samples[hi];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    return { x: a[0] + dx * f, y: a[1] + dy * f, nx: -dy / len, ny: dx / len };
  }
  // Holes 1..120 in groups of five, a start hole pair and one shared finish.
  const START = 90, END_PAD = 90, GAP = 16;
  const STEP = (LENGTH - START - END_PAD - 23 * GAP) / 119;
  const LANE = [14, -14]; // you on one side, the computer on the other
  function sAt(k) {
    if (k <= 0) return START - 46;
    if (k >= 121) return START + 119 * STEP + 23 * GAP + 46;
    return START + (k - 1) * STEP + Math.floor((k - 1) / 5) * GAP;
  }
  // Where a skunk line crosses: halfway between hole k and the next.
  const SKUNK_LINES = [[90, 1], [60, 2]];
  function skunkS(k) { return (sAt(k) + sAt(k + 1)) / 2; }

  // ---- The camera. It rests on a point of the trail; to reach a point out of

  async function peg(player, n, why) {

    const x0 = cam.x - w, x1 = cam.x + w, y0 = cam.y + AHEAD - h, y1 = cam.y + AHEAD + h;
    c.setAttribute('d', 'M' + x0 + ' ' + (y0 + l) + 'V' + y0 + 'H' + (x0 + l) + 'M' + (x1 - l) + ' ' + y0 + 'H' + x1 + 'V' + (y0 + l) +
      'M' + x1 + ' ' + (y1 - l) + 'V' + y1 + 'H' + (x1 - l) + 'M' + (x0 + l) + ' ' + y1 + 'H' + x0 + 'V' + (y1 - l));
  }


  function newGame(dealer) {
    g = K.newGame({ seed: (Date.now() % 1000000007), manualCut: true, dealer: dealer === undefined ? null : dealer });
    match.recorded = false; drawMatch();
    $('sub').textContent = (match.bestOf === 1 ? 'Single game' : 'Best of ' + match.bestOf) + ' against ' + (level === 'easy' ? 'an easy' : 'a ' + level) + ' opponent';
    fate = 0; drawFate();
    pegs.forEach((pg) => { pg.front = 0; pg.back = 0; });
    $('score-0').textContent = '0'; $('score-1').textContent = '0';
    placePegs(); drawMapPegs();
    const s = holeAt(0, 4); cam.x = s.x; cam.y = s.y; cam.lift = 0; applyCam();
    receipt = null; pileView = []; sel = [];
    after();
  }

  document.querySelectorAll('[data-env]').forEach((b) => {
    b.onclick = () => {
      place = b.dataset.env;
      document.querySelectorAll('[data-env]').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
      build(); applyCam();
    };
  });
  document.querySelectorAll('[data-peg]').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('[data-peg]').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
      setPegStyle(b.dataset.peg);
    };
  });

  $('fate-toggle').onclick = () => {
    fateOn = !fateOn;
    $('fate-toggle').setAttribute('aria-checked', String(fateOn));
    if (!fateOn) fate = 0;
    drawFate();
  };

  window.__kribbage = { lookAt: (k, p) => lookAt(holeAt(p || 0, k), true), setScores: (a, b) => { pegs[0].front = a; pegs[0].back = Math.max(0, a - 4); pegs[1].front = b; pegs[1].back = Math.max(0, b - 5); placePegs(); drawMapPegs(); } };
  window.addEventListener('resize', fit);
  build();
  fit();
  requestAnimationFrame(frame);
  newGame();
})();
</script>
